<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cart Compare</title>
  <meta name="description" content="Paste a grocery list, compare prices across stores, and build carts you check out yourself.">
  <meta name="theme-color" content="#1f7a4d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cart Compare">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Cart Compare</h1>
  </header>
  <main id="view"></main>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="list"><span aria-hidden="true">📝</span>List</button>
    <button data-tab="compare"><span aria-hidden="true">💲</span>Compare</button>
    <button data-tab="settings"><span aria-hidden="true">⚙️</span>Stores</button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
